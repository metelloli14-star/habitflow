# Checks every push and pull request: the same steps as `npm run verify` locally.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and integration tests (in-memory PostgreSQL)
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install the browser for end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (production build in a phone-sized browser)
        run: npm run test:e2e

      - name: Keep the browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
